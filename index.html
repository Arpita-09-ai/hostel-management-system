<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Management System | Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🏫 Hostel Management System</h1>
    <h3>Welcome! Please Login or Register</h3>

    <div class="tabs">
      <button id="loginTab" class="active" onclick="showTab('login')">Login</button>
      <button id="registerTab" onclick="showTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm" class="form">
      <label>Username:</label>
      <input type="text" id="loginUsername" placeholder="Enter username">

      <label>Password:</label>
      <input type="password" id="loginPassword" placeholder="Enter password">

      <button onclick="login()">Login</button>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" class="form" style="display:none;">
      <label>Name:</label>
      <input type="text" id="regName" placeholder="Enter your name">

      <label>Room No:</label>
      <input type="text" id="regRoom" placeholder="Enter your room number">

      <label>Username:</label>
      <input type="text" id="regUsername" placeholder="Choose username">

      <label>Password:</label>
      <input type="password" id="regPassword" placeholder="Choose password">

      <button onclick="register()">Register</button>
    </div>
  </div>

  <script>
    // Toggle tabs (Login/Register)
    function showTab(tab) {
      document.getElementById("loginForm").style.display = tab === "login" ? "block" : "none";
      document.getElementById("registerForm").style.display = tab === "register" ? "block" : "none";
      document.getElementById("loginTab").classList.toggle("active", tab === "login");
      document.getElementById("registerTab").classList.toggle("active", tab === "register");
    }

    // Register new student
    function register() {
      const name = document.getElementById("regName").value.trim();
      const room = document.getElementById("regRoom").value.trim();
      const username = document.getElementById("regUsername").value.trim();
      const password = document.getElementById("regPassword").value.trim();

      if (!name || !room || !username || !password) {
        alert("Please fill all fields!");
        return;
      }

      let students = JSON.parse(localStorage.getItem("students")) || [];
      if (students.some(s => s.username === username)) {
        alert("Username already exists!");
        return;
      }

      students.push({ name, room, username, password });
      localStorage.setItem("students", JSON.stringify(students));

      alert("Registration successful 🎉");
      showTab("login");
    }

    // Login for student or admin
    function login() {
      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      if (username === "admin" && password === "admin123") {
        alert("Admin Login Successful 🛠️");
        window.location.href = "admin.html";
        return;
      }

      const students = JSON.parse(localStorage.getItem("students")) || [];
      const student = students.find(s => s.username === username && s.password === password);

      if (student) {
        localStorage.setItem("currentStudent", JSON.stringify(student));
        alert("Welcome " + student.name + "!");
        window.location.href = "student.html";
      } else {
        alert("Invalid credentials!");
      }
    }
  </script>
</body>
</html>
